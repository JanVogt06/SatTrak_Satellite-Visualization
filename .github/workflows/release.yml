name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build image and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Refresh TLE snapshot
        run: ./tools/update-tle-snapshot.sh || echo "keeping the committed snapshot"

      - name: Cache Unity library
        uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-WebGL-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: WebGL
          unityVersion: 2022.3.62f3
          buildMethod: BuildWebGL.Run
          allowDirtyBuild: true

      - name: Upload build artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: build/WebGL/SatTrak
          retention-days: 7

      - name: Resolve image name
        if: github.ref_type == 'tag'
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/sattrak" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: github.ref_type == 'tag'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: github.ref_type == 'tag'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect image tags
        if: github.ref_type == 'tag'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Container image

            ```bash
            docker pull ${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}
            ```

            Built for `linux/amd64` and `linux/arm64`.

            ## Run it

            ```bash
            docker compose pull && docker compose up -d
            ```

            The container serves the WebGL build and refreshes the TLE catalogue from
            CelesTrak every two hours, so visitors never contact CelesTrak themselves.
